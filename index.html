      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Gavrio Port is the standard pickup point for Andros rentals because the ferries from Rafina port dock there. Local agencies often meet arrivals at the quay or just outside the port area, and summer arrivals can overlap within 15–30 minutes. The exception is a hotel-delivery booking that has been confirmed in writing by the agency."
      }
    },
    {
      "@type": "Question",
      "name": "Can I bring a mainland rental to Andros by ferry?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A mainland rental is usually a poor choice because the ferry fee, cross-sea restrictions, and insurance exclusions often erase any savings. Some rental policies add daily ferry surcharges or void CDW, SCDW, and FDW during sea crossings, so a local Andros pickup is typically safer and cheaper. Book an island operator in advance for July and August, when Andros supply sells out."
      }
